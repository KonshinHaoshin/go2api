server:
  listen: ":18080"
  read_timeout: 30
  auth_tokens:
    - "smoke-token"

upstream:
  base_url: "http://127.0.0.1:19000"
  timeout_seconds: 30

cache:
  enabled: false
  ttl: 1h
  skip_streaming: true
  max_response_bytes: 4194304

keypool:
  strategy: round_robin
  failover:
    enabled: false
    max_retries: 0
    cooldown_seconds: 60
    retry_on: [429, 500, 502, 503, 504]
  keys:
    - label: smoke
      api_key: "fake-key"
      weight: 1
